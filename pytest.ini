[pytest]
pythonpath = .
markers =
    mlx: marks MLX integration contract tests
    mlx_hardware: requires a usable native Apple Silicon Metal runtime
    infer_mlx_qualification: explicit live server/model matrix; a requested job fails missing prerequisites
    tui_pilot: marks Textual Pilot interaction tests
    tui_pty: marks PTY end-to-end smoke tests
    tui_snapshot: marks Textual visual snapshot tests
    jax: marks tests requiring JAX installation
    benchmark: reports timings; skipped unless selected with -m benchmark
filterwarnings =
    ignore:.*deprecated - use '.*'.*::matplotlib\..*
