name: CI

on:
    push:
        branches: [main, develop, release/dev]
    pull_request:
        branches: [main, release/v0.2-readiness, release/dev]
    schedule:
        - cron: "0 3 * * *"

permissions: {}

jobs:
    test:
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
                framework: [pytorch, tensorflow, jax]
                exclude:
                    - python-version: "3.12"
                      framework: tensorflow

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install base dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  pip install -e . --no-deps
                  pip install -r requirements-ci-base.txt

            - name: Install framework dependencies
              run: |
                  if [ "${{ matrix.framework }}" = "pytorch" ]; then
                      pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
                  elif [ "${{ matrix.framework }}" = "tensorflow" ]; then
                      pip install tensorflow-cpu==2.15.0
                  elif [ "${{ matrix.framework }}" = "jax" ]; then
                      pip install jax==0.4.20 jaxlib==0.4.20 'numpy<2.0.0' 'protobuf>=6.31.1'
                  fi

            - name: Verify JAX runtime
              if: matrix.framework == 'jax'
              run: |
                  python3 - <<'PY'
                  import jax
                  import jaxlib

                  print(f"jax={jax.__version__}")
                  print(f"jaxlib={jaxlib.__version__}")
                  devices = jax.devices()
                  if not devices:
                      raise RuntimeError("JAX initialized without any devices")
                  result = jax.numpy.arange(3) + 1
                  result.block_until_ready()
                  print(f"devices={devices}")
                  print(f"result={result}")
                  PY

            - name: Run tests
              run: |
                  if [ "${{ matrix.framework }}" = "pytorch" ]; then
                      python3 -m pytest tests/ --ignore-glob="tests/test_tf*.py" --ignore-glob="tests/test_jax*.py" -v -m "not tui_pilot and not tui_snapshot and not tui_pty" --cov=stormlog --cov-report=xml
                  elif [ "${{ matrix.framework }}" = "tensorflow" ]; then
                      python3 -m pytest tests/ -o "python_files=test_tf*.py" -v -m "not tui_pilot and not tui_snapshot and not tui_pty" --cov=stormlog --cov-report=xml
                  elif [ "${{ matrix.framework }}" = "jax" ]; then
                      python3 -m pytest tests/ -o "python_files=test_jax*.py" -v -ra -m "not tui_pilot and not tui_snapshot and not tui_pty" --cov=stormlog --cov-report=xml
                  fi

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  file: ./coverage.xml
                  flags: unittests
                  name: codecov-umbrella

    tui-pr-gate:
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.11"

            - name: Install TUI test dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  pip install -e . --no-deps
                  pip install -r requirements-ci-base.txt
                  pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu

            - name: Run TUI pilot and snapshot suites
              run: |
                  python3 -m pytest tests/tui/ -m "tui_pilot or tui_snapshot" -v

    tui-pty-smoke:
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.11"

            - name: Install PTY test dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  pip install -e . --no-deps
                  pip install -r requirements-ci-base.txt
                  pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu

            - name: Run TUI PTY smoke suite
              run: |
                  python3 -m pytest tests/e2e/test_tui_pty.py -m tui_pty -v

    lint:
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            matrix:
                python-version: ["3.10"]

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  # Lint does not require heavy runtime ML dependencies.
                  pip install -e . --no-deps
                  pip install -r requirements-ci-lint.txt

            - name: Run isort
              run: |
                  python3 -m isort --check --diff stormlog/ tests/ examples/

            - name: Run black
              run: |
                  python3 -m black --check stormlog/ tests/ examples/

            - name: Run flake8
              run: |
                  python3 -m flake8 stormlog/ tests/ examples/ --show-source --statistics

            - name: Run mypy
              run: |
                  python3 -m mypy stormlog/

    workflow-audit:
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.11"

            - name: Install workflow audit tool
              run: |
                  python3 -m pip install --upgrade pip
                  pip install zizmor

            - name: Audit GitHub Actions workflows
              run: |
                  zizmor .github/workflows/*.yml

    docs:
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.11"

            - name: Install docs dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  pip install -e . --no-deps
                  pip install -r docs/requirements-rtd.txt

            - name: Build docs with warnings as errors
              run: |
                  python3 -m sphinx -W --keep-going -b html docs docs/_build/html

    build:
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        needs: [test, lint, workflow-audit, docs]

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.10"

            - name: Install build dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  pip install build twine

            - name: Build package
              run: |
                  python3 -m build

            - name: Check package
              run: |
                  twine check dist/*

            - name: Upload build artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: dist
                  path: dist/

    memory-regression-gate:
        if: github.event_name != 'schedule'
        runs-on: ubuntu-24.04
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.10"

            - name: Install benchmark regression dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  pip install -e . --no-deps
                  pip install -r requirements-ci-base.txt
                  pip install tensorflow-cpu==2.15.0

            - name: Run memory regression gate
              run: |
                  python3 -m examples.cli.benchmark_harness \
                    --check \
                    --profile pr \
                    --mode all \
                    --gate-mode regression \
                    --iterations 5000 \
                    --baseline docs/benchmarks/v0.4_baseline.json \
                    --tolerances docs/benchmarks/v0.4_tolerances.json \
                    --output artifacts/benchmarks/ci_regression.json \
                    --artifact-root artifacts/benchmarks/ci_scenarios

            - name: Upload benchmark regression artifacts
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: benchmark-regression-artifacts
                  path: artifacts/benchmarks/

    memory-operability-budget:
        if: github.event_name == 'schedule'
        runs-on: ubuntu-24.04
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.10"

            - name: Install benchmark budget dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  pip install -e . --no-deps
                  pip install -r requirements-ci-base.txt
                  pip install tensorflow-cpu==2.15.0

            - name: Run nightly operability budget gate
              run: |
                  python3 -m examples.cli.benchmark_harness \
                    --check \
                    --profile nightly \
                    --mode all \
                    --gate-mode budget \
                    --iterations 5000 \
                    --budgets docs/benchmarks/v0.4_operating_budget.json \
                    --output artifacts/benchmarks/ci_nightly_budget.json \
                    --artifact-root artifacts/benchmarks/ci_nightly_scenarios

            - name: Upload nightly operability artifacts
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: benchmark-operability-artifacts
                  path: artifacts/benchmarks/

    artifact-cli-smoke:
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        needs: [build]

        steps:
            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.10"

            - name: Download build artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: dist
                  path: dist

            - name: Install built wheel in a fresh environment
              run: |
                  python3 -m venv .venv-wheel-smoke
                  . .venv-wheel-smoke/bin/activate
                  python -m pip install --upgrade pip
                  WHEEL_PATH="$(python3 - <<'PY'
                  from pathlib import Path

                  wheels = sorted(Path("dist").glob("stormlog-*.whl"))
                  if len(wheels) != 1:
                      raise SystemExit(
                          f"Expected exactly one wheel in dist/, found {len(wheels)}."
                      )
                  print(wheels[0].resolve())
                  PY
                  )"
                  pip install "$WHEEL_PATH"
                  pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu

            - name: Smoke test documented CLI workflow from the wheel
              env:
                  CUDA_VISIBLE_DEVICES: ""
              run: |
                  . .venv-wheel-smoke/bin/activate
                  mkdir -p smoke
                  cd smoke
                  gpumemprof --help
                  gpumemprof info
                  gpumemprof track --duration 1 --interval 0.2 --output track.json --format json
                  gpumemprof analyze track.json --format txt --output analysis.txt
                  test -s track.json
                  test -s analysis.txt

    examples-smoke:
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        needs: [test, lint, docs]

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.10"

            - name: Install source-checkout example dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  pip install -e . --no-deps
                  pip install -r requirements-ci-base.txt

            - name: Run source-checkout example smoke tests
              run: |
                  python3 -m examples.cli.quickstart
                  python3 -m examples.cli.capability_matrix --mode smoke --target auto --oom-mode simulated --skip-tui
