name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Optional release version override. Defaults to the next stable version."
                required: false
                type: string

permissions: {}

concurrency:
    group: release-main
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            contents: write
            id-token: write
        env:
            GH_TOKEN: ${{ github.token }}

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.10"

            - name: Require main branch
              run: |
                  if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                      echo "Release workflow must be dispatched from main." >&2
                      exit 1
                  fi

            - name: Resolve release version
              id: version
              env:
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  git fetch --force --tags origin

                  EXISTING_TAG="$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

                  if [ -n "${EXISTING_TAG}" ]; then
                      VERSION="${EXISTING_TAG#v}"
                      if [ -n "${INPUT_VERSION}" ] && [ "${INPUT_VERSION}" != "${VERSION}" ]; then
                          echo "Input version ${INPUT_VERSION} does not match existing HEAD tag ${EXISTING_TAG}." >&2
                          exit 1
                      fi
                  else
                      VERSION="${INPUT_VERSION:-$(python3 -m stormlog.release_version)}"
                  fi

                  TAG="v${VERSION}"
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                  echo "Resolved release tag: ${TAG}"
                  echo "Resolved package version: ${VERSION}"

                  if git rev-parse "${TAG}" >/dev/null 2>&1; then
                      TAG_SHA="$(git rev-list -n 1 "${TAG}")"
                      HEAD_SHA="$(git rev-parse HEAD)"
                      if [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
                          echo "Tag ${TAG} already points to ${TAG_SHA}, not ${HEAD_SHA}." >&2
                          exit 1
                      fi
                  fi

            - name: Install build dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  pip install build twine

            - name: Build package
              env:
                  SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  rm -rf build dist
                  python3 -m build

            - name: Check package
              run: |
                  twine check dist/*

            - name: Verify artifact versions
              env:
                  EXPECTED_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  python3 - <<'PY'
                  import os
                  from pathlib import Path

                  expected = os.environ["EXPECTED_VERSION"]
                  dist_files = sorted(Path("dist").glob("*"))
                  if not dist_files:
                      raise SystemExit("No build artifacts were produced.")

                  for path in dist_files:
                      if expected not in path.name:
                          raise SystemExit(
                              f"Artifact {path.name} does not contain expected version {expected}."
                          )
                  PY

            - name: Enforce release artifact version policy
              run: |
                  if ls dist/* | grep -Eq '(\.dev|[+])'; then
                      echo "Refusing upload: dist contains dev/local versions." >&2
                      ls -1 dist
                      exit 1
                  fi

            - name: Publish to PyPI with Trusted Publishing
              uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
              with:
                  skip-existing: true

            - name: Create or update GitHub release
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
                  RELEASE_TARGET: ${{ github.sha }}
              run: |
                  if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
                      gh release upload "${RELEASE_TAG}" dist/* --clobber
                  else
                      gh release create "${RELEASE_TAG}" dist/* \
                          --target "${RELEASE_TARGET}" \
                          --title "${RELEASE_TAG}" \
                          --generate-notes
                  fi
